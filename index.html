<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
       <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<style>
    *{
        box-sizing: border-box;
        padding: 0;
        margin: 0;
    }
    main{
        height: 100vh;
        /* background-color: blue; */
    }
    .top{
        height: 5%;
        background-color: pink;
    }
    .middle{
        height: 85%;
    }
    .ontop{
        height: 25%;
        /* background-color: red; */
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .mid{
        height: 50%;
        /* background-color: red; */
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
    }
    .under {
        height: 10%;
        margin-top: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .footer{
        height: 10%;
        background-color: rgb(128, 111, 0);
    }
    .image{
        height: 100%;
        width: 100%;
        /* background-color: blue; */
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 30px;
        
    }
    .card {
        text-align: center;
        border-radius: 12px;
        overflow: hidden;
        padding: 10px;
        margin: 10px;
        box-shadow: 0 4px 8px pink;
        transition: all 0.3s ease;
    }
    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 16px pink;
    }
    a{
        text-decoration: none;
    }
</style>
<body>
    <main>
        <div class="top">
            
        </div>
        <div class="middle">
            <div class="ontop">
                <h5>Featured Products</h5>
            </div>
            <div class="mid">
                <div class="image" id="demo"></div>
            </div>
                <div class="under">
                    <a href="#" class="btn btn-primary px-4">Products</a>
                </div>
        </div>
        <div class="footer">

        </div>
    </main>
    <script src="fech.js">
    </script>
</body>
</html>
